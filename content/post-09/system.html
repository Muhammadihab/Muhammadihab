<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>بوست ٩ · انت السيستم</title>
<style>
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Sora;src:url(fonts/sora-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Ruqaa;src:url(fonts/aref-ruqaa-arabic-700-normal.woff2);font-weight:700}
:root{--cyan:#00CCF2;--cyan2:#3FD6F5;--orange:#F56A39;--text:#F4F7FB;--muted:#AFC1D8;--ink:#071A33;--red:#FF453A;--green:#30D158;--gray:#8E8E93;--wa:#25D366}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
body{position:relative;font-family:Plex,sans-serif;color:var(--text)}
.abs{position:absolute}.full{position:absolute;inset:0}
svg.i{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#bg{background:
  linear-gradient(rgba(0,204,242,.05) 1px,transparent 1px) 0 0/60px 60px,
  linear-gradient(90deg,rgba(0,204,242,.05) 1px,transparent 1px) 0 0/60px 60px,
  radial-gradient(ellipse 60% 55% at 50% 45%,#0F3561 0%,#0B2A4F 45%,#071A33 100%)}
#halo{background:radial-gradient(ellipse 28% 32% at 50% 42%,rgba(0,204,242,.22),transparent 72%)}
.s1 #halo{background:radial-gradient(ellipse 30% 32% at 50% 42%,rgba(245,106,57,.13),rgba(0,204,242,.06) 50%,transparent 75%)}
#grain{filter:url(#noise);opacity:.06;mix-blend-mode:overlay}

/* ---------- phone ---------- */
#rig{left:330px;top:104px;width:420px;height:860px}
.s1 #rig{transform:rotate(-6deg)}
#phone{position:absolute;inset:0;border-radius:68px;padding:13px;
  background:linear-gradient(135deg,#4A5568 0%,#1A202C 18%,#2D3748 50%,#141A24 82%,#3B4658 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.10) inset,0 0 70px rgba(0,204,242,.20),0 50px 100px rgba(0,0,0,.6)}
#screen{position:relative;width:100%;height:100%;border-radius:56px;overflow:hidden;direction:rtl}
#island{position:absolute;left:50%;top:14px;width:116px;height:34px;margin-left:-58px;border-radius:18px;background:#000;z-index:5}
#status{position:absolute;top:18px;left:34px;right:40px;display:flex;justify-content:space-between;align-items:center;font:600 21px Plex;color:#fff;z-index:5}
#batt{display:flex;align-items:center;gap:6px;direction:ltr}
#batt .b{position:relative;width:38px;height:18px;border-radius:6px;border:2px solid rgba(255,255,255,.5);padding:2px}
#batt .b i{display:block;height:100%;border-radius:2px}
#batt .b:after{content:'';position:absolute;right:-5px;top:5px;width:3px;height:5px;border-radius:0 2px 2px 0;background:rgba(255,255,255,.5)}
#batt span{font:600 18px Plex}

/* incoming call */
#call{position:absolute;inset:0;background:radial-gradient(ellipse 120% 60% at 50% 0%,#28456E,#101B2E 55%,#0A0F1A);text-align:center}
#call .kind{margin-top:104px;font:400 22px Plex;color:rgba(235,235,245,.6)}
#call .name{font:600 50px Plex;color:#fff;margin-top:2px}
#call .av{width:170px;height:170px;border-radius:50%;margin:64px auto 0;background:linear-gradient(160deg,#8E9AAF,#5A6478);display:flex;align-items:center;justify-content:center;font:600 86px Plex;color:#fff}
#call .mini{position:absolute;left:58px;right:58px;bottom:212px;display:flex;justify-content:space-between}
#call .mini div{width:84px;text-align:center;font:400 17px Plex;color:#fff}
#call .mini span{display:flex;width:56px;height:56px;margin:0 auto 6px;border-radius:50%;background:rgba(255,255,255,.14);align-items:center;justify-content:center}
#call .mini span svg{width:26px;height:26px}
#call .btns{position:absolute;left:50px;right:50px;bottom:72px;display:flex;justify-content:space-between;direction:ltr}
#call .btns div{width:96px;text-align:center;font:400 19px Plex;color:#fff}
#call .btns span{display:flex;width:90px;height:90px;margin:0 auto 8px;border-radius:50%;align-items:center;justify-content:center}
#call .btns span svg{width:42px;height:42px;stroke:none}
.pulse{position:absolute;left:3px;top:0;width:90px;height:90px;border-radius:50%;border:3px solid rgba(48,209,88,.8);transform:scale(var(--s));box-shadow:0 0 18px rgba(48,209,88,.5)}

/* dashboard */
#dash{position:absolute;inset:0;background:linear-gradient(180deg,#0C2C52,#081E3A 55%,#071A33);padding:78px 22px 0}
#dash .hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}
#dash .hd small{display:block;font:400 18px Plex;color:var(--muted)}
#dash .hd b{font:700 36px Plex}
#dash .hd i{width:46px;height:46px;border-radius:50%;background:rgba(0,204,242,.16);border:1.5px solid rgba(0,204,242,.6);color:var(--cyan2);display:flex;align-items:center;justify-content:center;font-style:normal;padding:10px}
#dash .kpis{display:flex;gap:12px;margin-bottom:16px}
#dash .kpi{flex:1;border-radius:20px;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
#dash .kpi small{font:400 17px Plex;color:var(--muted)}
#dash .kpi div{font:700 40px Plex;color:var(--cyan2);line-height:1.2}
#dash .card{border-radius:22px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px 16px}
#dash .card h4{font:600 19px Plex;color:var(--muted);padding:10px 0 4px}
.row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:none}
.row .ic{width:48px;height:48px;flex:none;border-radius:14px;background:rgba(0,204,242,.14);color:var(--cyan2);display:flex;align-items:center;justify-content:center}
.row .ic svg{width:26px;height:26px}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font:600 22px Plex;white-space:nowrap}
.row .tx small{font:400 18px Plex;color:var(--muted);white-space:nowrap}
.row .ok{width:30px;height:30px;flex:none;border-radius:50%;background:rgba(48,209,88,.16);color:var(--green);display:flex;align-items:center;justify-content:center}
.row .ok svg{width:18px;height:18px;stroke-width:3}
#dash .tabs{position:absolute;left:0;right:0;bottom:0;height:96px;background:rgba(5,15,31,.9);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;padding-top:16px;color:rgba(191,208,230,.45)}
#dash .tabs span{width:30px;height:30px}#dash .tabs span.on{color:var(--cyan2)}

/* notifications */
.nt{position:absolute;width:390px;border-radius:26px;padding:16px 18px;direction:rtl;
  background:rgba(28,36,52,.82);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);
  box-shadow:0 24px 50px rgba(0,0,0,.45);display:flex;gap:14px;align-items:flex-start}
.nt .ap{width:52px;height:52px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.nt .ap svg{width:32px;height:32px}
.nt .bd{flex:1;min-width:0}
.nt .tt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nt .tt b{font:700 22px Plex;white-space:nowrap}
.nt .tt small{font:400 17px Plex;color:var(--gray);white-space:nowrap}
.nt p{font:400 23px Plex;line-height:1.4;color:#E5EAF2}
.nt.far{filter:blur(2.2px);opacity:.6}

.note{position:absolute;font:700 40px Ruqaa;color:var(--orange);line-height:1.3;direction:rtl;text-shadow:0 0 18px rgba(245,106,57,.35);white-space:nowrap}
.arw path{fill:none;stroke:var(--orange);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(245,106,57,.5))}
.chip{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 22px;border-radius:22px;direction:rtl;
  background:rgba(11,42,79,.75);border:1.5px solid rgba(0,204,242,.5);backdrop-filter:blur(10px);box-shadow:0 0 30px rgba(0,204,242,.2),0 20px 40px rgba(0,0,0,.35)}
.chip small{display:block;font:400 18px Plex;color:var(--muted)}
.chip b{font:700 34px Plex;color:var(--cyan2)}
.chip .ok{width:44px;height:44px;border-radius:50%;background:rgba(48,209,88,.16);color:var(--green);display:flex;align-items:center;justify-content:center;padding:9px}
#px{left:66px;top:990px;width:90px;height:40px}
#px i{position:absolute;background:var(--orange);border-radius:2px}

/* whatsapp chat */
#wa{position:absolute;inset:0;background:#0B141A;display:flex;flex-direction:column}
#wa .top{display:flex;align-items:center;gap:12px;padding:66px 18px 14px;background:#1F2C34;direction:rtl}
#wa .bk{width:26px;height:26px;color:#AEBAC1;transform:scaleX(-1)}
#wa .av{width:52px;height:52px;border-radius:50%;background:#0A2444;border:1.5px solid var(--cyan);display:flex;align-items:center;justify-content:center;font:700 22px Sora;color:var(--cyan2)}
#wa .top b{display:block;font:700 23px Sora;color:#E9EDEF;direction:ltr;text-align:right}
#wa .top small{font:400 17px Plex;color:#8696A0}
#wa .chat{flex:1;padding:16px 16px 0;background:#0B141A;direction:rtl;display:flex;flex-direction:column}
#wa .sys{margin:0 auto 14px;max-width:90%;padding:10px 16px;border-radius:12px;background:#182229;font:400 17px Plex;line-height:1.5;color:#FFD279;text-align:center}
#wa .gap{flex:1}
#wa .day{margin:0 auto 14px;width:max-content;padding:5px 14px;border-radius:10px;background:#182229;font:400 16px Plex;color:#8696A0}
#wa .in,#wa .out{max-width:84%;padding:12px 16px 28px;border-radius:16px;font:400 22px Plex;line-height:1.45;color:#E9EDEF;position:relative;margin-bottom:12px}
#wa .in{background:#202C33;border-top-right-radius:4px;margin-left:auto}
#wa .out{background:#005C4B;border-top-left-radius:4px;margin-right:auto}
#wa em{position:absolute;left:12px;bottom:6px;font:400 14px Plex;font-style:normal;color:rgba(233,237,239,.6)}
#wa .bar{display:flex;align-items:center;gap:10px;padding:12px 14px 40px;background:#0B141A;direction:rtl}
#wa .fld{flex:1;height:52px;border-radius:26px;background:#1F2C34;display:flex;align-items:center;padding:0 20px;font:400 20px Plex;color:#8696A0}
#wa .mic{width:52px;height:52px;border-radius:50%;background:#00A884;display:flex;align-items:center;justify-content:center;padding:13px}
#cta{display:inline-flex;align-items:center;gap:14px;margin-top:20px;padding:0 34px 0 30px;height:84px;border-radius:999px;background:var(--orange);font:700 32px Plex;color:#fff;box-shadow:0 12px 40px rgba(245,106,57,.45)}
#cta .w{width:40px;height:40px;display:flex}
#cta .w svg{width:100%;height:100%}
#cta .num{font:700 22px Sora;direction:ltr;padding-right:16px;border-right:2px solid rgba(255,255,255,.4)}
.s3 #rig{transform:rotate(3deg)}
/* ---------- band ---------- */
#sink{left:0;right:0;top:880px;height:80px;background:linear-gradient(180deg,rgba(6,20,40,0),rgba(6,20,40,.6))}
#band{left:0;right:0;top:960px;bottom:0;background:linear-gradient(180deg,#061428,#050F1F 80%)}
#bandLine{left:0;right:0;top:960px;height:2px;background:linear-gradient(90deg,transparent,rgba(0,204,242,.85) 30%,rgba(0,204,242,.85) 70%,transparent);box-shadow:0 0 18px rgba(0,204,242,.6)}
#copy{left:64px;right:64px;top:986px;direction:rtl;text-align:right}
#l1{font:600 46px Plex;color:#D6E2F0;line-height:1.3}
#l2{font:700 92px Plex;line-height:1.18;letter-spacing:-.5px;white-space:nowrap}
#l2 .br{font:700 86px Sora;color:var(--cyan);text-shadow:0 0 22px rgba(0,204,242,.5)}
#l2 .k{color:var(--cyan2)}
#l2 .dot{color:var(--orange)}
#sub{font:400 29px Plex;color:var(--muted);margin-top:8px}
#foot{left:64px;right:64px;bottom:30px;display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid rgba(191,208,230,.14);direction:rtl}
#foot .wa{font:400 23px Plex;color:var(--muted)}
#foot .wa b{color:var(--cyan2);font-weight:700}
#foot .r{font:700 20px Sora;color:rgba(191,208,230,.6);letter-spacing:.5px}
#foot .swipe{font:600 23px Plex;color:#fff;display:flex;align-items:center;gap:10px}
#foot .swipe span{width:28px;height:28px;color:var(--orange)}
#logo{left:40px;top:34px;width:178px}
#tag{right:52px;top:50px;padding:10px 30px;border:2.5px solid var(--cyan);border-radius:999px;font:600 30px Plex;color:var(--cyan2);direction:rtl;background:rgba(7,26,51,.5)}
#count{left:50%;top:62px;transform:translateX(-50%);display:flex;gap:10px}
#count i{width:34px;height:6px;border-radius:3px;background:rgba(191,208,230,.22)}
#count i.on{background:var(--cyan);box-shadow:0 0 10px rgba(0,204,242,.8)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter></svg>
<div id="bg" class="full"></div>
<div id="halo" class="full"></div>
<div id="back"></div>
<div id="rig" class="abs"><div id="phone"><div id="screen">
  <div id="island"></div>
  <div id="status"><span>١١:٤٨</span><span id="batt"><span id="bt"></span><span class="b"><i id="bi"></i></span></span></div>
  <div id="content"></div>
</div></div></div>
<div id="sink" class="abs"></div>
<div id="front"></div>
<svg class="full arw" width="1080" height="1350" id="arw"></svg>

<div id="band" class="abs"></div><div id="bandLine" class="abs"></div>
<div id="px" class="abs"></div>
<div id="copy" class="abs"><div id="l1"></div><div id="l2"></div><div id="sub"></div></div>
<div id="foot" class="abs"></div>
<img id="logo" class="abs" src="brand/logo-on-dark.png">
<div id="tag" class="abs">لصاحب الشغل</div>
<div id="count" class="abs"><i></i><i></i><i></i></div>
<div id="grain" class="full"></div>

<script>
const P={
 wa:'<path d="M4 20l1.2-4.3A8 8 0 1 1 8.4 19z" fill="#fff" stroke="none"/><path d="M9.2 8.4c0 3.2 2.9 6.2 6.2 6.2l.9-1.5-1.9-1-1 .8c-1-.4-2.1-1.5-2.5-2.5l.8-1-1-1.9z" fill="#25D366" stroke="none"/>',
 phone:'<path d="M6.6 3h3l1.5 4-2 1.3a11 11 0 0 0 6.6 6.6l1.3-2 4 1.5v3A2 2 0 0 1 19 19.6 16.5 16.5 0 0 1 4.4 5 2 2 0 0 1 6.6 3z"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',
 bill:'<path d="M6 2.5h12v19l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 truck:'<path d="M2.5 6h11v10h-11zM13.5 9.5h4l3 3.5V16h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 msg:'<path d="M4 5h16v11H9l-5 4z"/>',
 home:'<path d="M3 11 12 4l9 7v9H3z"/>',
 chart:'<path d="M5 20V10M12 20V4M19 20v-7"/>',
 left:'<path d="M19 12H5M11 6l-6 6 6 6"/>'};
const ic=(k,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24">${P[k]}</svg>`;
const solid=k=>`<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="${P[k].match(/d="([^"]+)"/)[1]}" fill="#fff"/></svg>`;
const put=(id,h)=>document.getElementById(id).insertAdjacentHTML('beforeend',h);
const nt=(x,y,r,app,title,time,msg,far)=>`<div class="nt${far?' far':''}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg)${far?' scale(.9)':''}">
  <span class="ap" style="background:${app==='wa'?'var(--wa)':'var(--green)'}">${app==='wa'?`<svg viewBox="0 0 24 24">${P.wa}</svg>`:`<span style="width:30px;height:30px">${solid('phone')}</span>`}</span>
  <div class="bd"><div class="tt"><b>${title}</b><small>${time}</small></div><p>${msg}</p></div></div>`;

const n=(parseInt(location.hash.slice(1))||1);
document.body.className='s'+n;
document.querySelectorAll('#count i').forEach((e,k)=>{if(k<n)e.className='on'});
const arw=document.getElementById('arw');

if(n===1){
  const bt=document.getElementById('bt');bt.textContent='٩٪';bt.style.color='var(--red)';
  Object.assign(document.getElementById('bi').style,{width:'12%',background:'var(--red)'});
  put('content',`<div id="call">
    <div class="kind">موبايل</div><div class="name">أحمد الفني</div>
    <div class="av">أ</div>
    <div class="mini"><div><span>${ic('clock')}</span>تذكير</div><div><span>${ic('msg')}</span>رسالة</div></div>
    <div class="btns"><div><span style="background:var(--red)"><span style="width:42px;height:42px;transform:rotate(135deg)">${solid('phone')}</span></span>رفض</div>
      <div style="position:relative"><i class="pulse" style="--s:1.25"></i><i class="pulse" style="--s:1.38;opacity:.45"></i><span style="background:var(--green);position:relative"><span style="width:42px;height:42px">${solid('phone')}</span></span>قبول</div></div>
  </div>`);
  // notifications: far ones sit behind the phone, near ones in front
  put('back',nt(650,190,6,'ph','مكالمات فائتة','الآن','٦ مكالمات من «المخزن» و«عم مصطفى»',1));
  put('back',nt(40,560,-5,'wa','جروب الفنيين','٢ د','٤٧ رسالة جديدة',1));
  put('front',nt(28,350,-4,'wa','عم مصطفى · عميل','الآن','الفني فين؟ بقالي ساعتين مستني 😤'));
  put('front',nt(662,420,4,'wa','المخزن','١ د','الكمبروسر خلص… أطلب تاني؟'));
  put('front',nt(36,730,3,'wa','المحاسب','٥ د','فاتورة إمبارح مش مظبوطة'));
  put('front',`<div class="note" style="left:760px;top:650px">المكالمة رقم ٥٣<br>النهارده!</div>`);
  arw.innerHTML=`<path d="M800 760 C775 790 750 798 724 798"/><path d="M742 786 L724 798 L742 810"/>`;
  document.getElementById('l1').textContent='انت مش صاحب الشركة…';
  document.getElementById('l2').innerHTML='<span class="br">{</span><span class="k">انت</span><span class="br">}</span> السيستم بتاعها<span class="dot">.</span>';
  document.getElementById('sub').textContent='كل سؤال في الشغل بيعدّي عليك… ولو قفلت موبايلك، الشغل يقف.';
  document.getElementById('foot').innerHTML=`<span class="wa">كلّمنا على <b>الواتساب</b></span><span class="swipe">اسحب وشوف الفرق <span>${ic('left')}</span></span>`;
}else if(n===2){
  document.getElementById('bt').textContent='٦٤٪';
  Object.assign(document.getElementById('bi').style,{width:'64%',background:'#fff'});
  const R=[['user','أحمد الفني','وصل للعميل · ١٠:١٢ م'],['box','كمبروسر','٣ قطع في المخزن'],['bill','عم مصطفى','دفع الفاتورة · ٩:٤٠ م'],['truck','أوردر ٢١٤','خرج مع كريم · ٨:٢٥ م']];
  put('content',`<div id="dash">
    <div class="hd"><div><small>لوحة التحكم</small><b>النهارده</b></div><i>${ic('user')}</i></div>
    <div class="kpis"><div class="kpi"><small>أعطال مفتوحة</small><div>٤</div></div><div class="kpi"><small>اتقفلت النهارده</small><div>١٧</div></div></div>
    <div class="card"><h4>آخر الأخبار</h4>${R.map(([k,t,s])=>`<div class="row"><span class="ic">${ic(k)}</span><div class="tx"><b>${t}</b><small>${s}</small></div><span class="ok">${ic('check')}</span></div>`).join('')}</div>
    <div class="tabs"><span class="on">${ic('home')}</span><span>${ic('user')}</span><span>${ic('box')}</span><span>${ic('chart')}</span></div>
  </div>`);
  put('front',`<div class="chip" style="left:44px;top:300px;transform:rotate(-3deg)"><div><small>مكالمات النهارده</small><b>صفر</b></div></div>`);
