<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>بوست ٩ · اسأل قبل ما تمضي</title>
<style>
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex;src:url(fonts/ibm-plex-sans-arabic-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Sora;src:url(fonts/sora-latin-700-normal.woff2);font-weight:700}
:root{--cyan:#00CCF2;--cyan2:#3FD6F5;--orange:#F56A39;--text:#F4F7FB;--muted:#AFC1D8;--ink:#071A33}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
body{position:relative;font-family:Plex,sans-serif;color:var(--text)}
.abs{position:absolute}.full{position:absolute;inset:0}

#bg{background:
  linear-gradient(rgba(0,204,242,.05) 1px,transparent 1px) 0 0/60px 60px,
  linear-gradient(90deg,rgba(0,204,242,.05) 1px,transparent 1px) 0 0/60px 60px,
  radial-gradient(ellipse 65% 50% at 50% 40%,#0F3561 0%,#0B2A4F 45%,#071A33 100%)}
#light{background:radial-gradient(ellipse 34% 26% at 50% 44%,rgba(0,204,242,.16),transparent 70%)}
#grain{filter:url(#noise);opacity:.06;mix-blend-mode:overlay}

/* glass */
.glass{position:absolute;border-radius:30px;background:linear-gradient(160deg,rgba(63,214,245,.17),rgba(11,42,79,.55) 60%);
  border:2px solid rgba(0,204,242,.55);box-shadow:0 0 50px rgba(0,204,242,.22),0 30px 60px rgba(0,0,0,.35),inset 0 1.5px 0 rgba(255,255,255,.22);direction:rtl}
.bar{height:14px;border-radius:7px;background:rgba(191,208,230,.22)}
.chk{width:44px;height:44px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,204,242,.16);border:2px solid var(--cyan);color:var(--cyan2)}
.chk svg{width:24px;height:24px}
.box{width:40px;height:40px;flex:none;border-radius:10px;border:2.5px solid rgba(63,214,245,.7)}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:0 26px;height:68px;border-radius:999px;font:600 28px Plex;direction:rtl;white-space:nowrap}
.row{display:flex;align-items:center;gap:20px}

/* band (same system as post 2) */
#band{left:0;right:0;top:1000px;bottom:0;background:linear-gradient(180deg,rgba(6,20,40,.97),#050F1F 85%)}
#bandLine{left:0;right:0;top:1000px;height:2px;background:linear-gradient(90deg,transparent,rgba(0,204,242,.85) 30%,rgba(0,204,242,.85) 70%,transparent);box-shadow:0 0 18px rgba(0,204,242,.6)}
#copy{left:64px;right:64px;top:1000px;bottom:58px;display:flex;flex-direction:column;justify-content:flex-end;direction:rtl;text-align:right}
#kick{font:600 32px Plex;color:var(--cyan2);margin-bottom:6px}
#head{font:700 80px Plex;line-height:1.22;white-space:nowrap}
#head .o{color:var(--orange)}
#sub{font:400 31px Plex;color:var(--muted);line-height:1.5;margin-top:12px}
#cta{align-self:flex-start;margin-top:22px;display:flex;align-items:center;gap:14px;padding:0 40px;height:84px;border-radius:999px;background:var(--orange);
  font:700 32px Plex;color:#fff;box-shadow:0 12px 40px rgba(245,106,57,.45)}
#logo{left:40px;top:34px;width:178px}
#tag{right:52px;top:50px;padding:10px 30px;border:2.5px solid var(--cyan);border-radius:999px;font:600 30px Plex;color:var(--cyan2);direction:rtl}
#count{left:50%;top:60px;transform:translateX(-50%);display:flex;gap:10px}
#count i{width:34px;height:6px;border-radius:3px;background:rgba(191,208,230,.22)}
#count i.on{background:var(--cyan);box-shadow:0 0 10px rgba(0,204,242,.8)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</svg>
<div id="bg" class="full"></div>
<div id="light" class="full"></div>
<div id="art" class="full"></div>
<div id="band" class="abs"></div><div id="bandLine" class="abs"></div>
<div id="copy" class="abs"><div id="kick"></div><div id="head"></div><div id="sub"></div></div>
<img id="logo" class="abs" src="brand/logo-on-dark.png">
<div id="tag" class="abs">لصاحب الفكرة</div>
<div id="count" class="abs"></div>
<div id="grain" class="full"></div>

<script>
const I={
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
 key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 20 3M16.5 6.5l3 3M14 9l2 2"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 shield:'<path d="M12 2.5 20 5.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z"/>',
 bug:'<rect x="8" y="7" width="8" height="12" rx="4"/><path d="M12 7V4M8 11H4M8 15H4M16 11h4M16 15h4M9 4l1.5 2M15 4l-1.5 2"/>',
 arrow:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 pen:'<path d="M16.5 3.5l4 4L8 20H4v-4z"/><path d="M13.5 6.5l4 4"/>',
 wa:'<path d="M3.5 20.5l1.3-4.6A8.5 8.5 0 1 1 8 19.3z"/><path d="M9 8.6c0 3.3 3 6.4 6.4 6.4l1-1.6-2-1-1 .8c-1-.4-2.2-1.6-2.6-2.6l.8-1-1-2z" stroke-width="1.4"/>'};
const svg=(d,w=2.2)=>`<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ic=(k,size,color,w)=>`<span style="display:inline-flex;width:${size}px;height:${size}px;color:${color}">${svg(I[k],w)}</span>`;
const chk=()=>`<span class="chk">${svg(I.check,3)}</span>`;
const el=(html)=>{const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild};
const art=document.getElementById('art');
const put=(html)=>art.appendChild(el(html));

const SLIDES=[
 { // cover
  kick:'احفظ البوست ده، وارجعله قبل أي اجتماع',
  head:'قبل ما تمضي مع أي شركة برمجة…',head2:'اسألها ٥ أسئلة<span class="o">.</span>',
  sub:'',dy:50,
  draw(){
   put(`<div class="glass" style="left:300px;top:190px;width:480px;height:620px;transform:rotate(-3deg);padding:46px 46px 0">
     <div style="font:700 34px Plex;margin-bottom:10px">عقد تطوير تطبيق</div>
     <div class="bar" style="width:62%;margin-bottom:34px"></div>
     ${[78,64,84,58,72].map(w=>`<div class="row" style="margin-bottom:26px"><span class="box"></span><div class="bar" style="width:${w}%;height:16px"></div></div>`).join('')}
     <div style="position:absolute;left:46px;right:46px;bottom:62px;border-top:3px dashed rgba(191,208,230,.4)"></div>
     <div style="position:absolute;right:46px;bottom:24px;font:400 24px Plex;color:var(--muted)">التوقيع</div>
   </div>`);
   put(`<div class="abs" style="left:230px;top:600px;width:190px;height:190px;color:var(--orange);transform:rotate(8deg);filter:drop-shadow(0 0 18px rgba(245,106,57,.55))">${svg(I.pen,1.6)}</div>`);
  }},
 { // 1 ownership
  kick:'سؤال ١ من ٥',
  head:'الكود والحسابات… باسم مين<span class="o">؟</span>',
  sub:'لازم يبقوا باسمك انت من أول يوم.<br>مش باسم الشركة، ولا باسم المبرمج.',dy:95,
  draw(){
   put(`<svg class="abs" style="left:290px;top:200px" width="500" height="400" viewBox="0 0 500 400" filter="url(#glow)">
     <defs><linearGradient id="fg" x1="0" y1="0" x2=".4" y2="1"><stop offset="0" stop-color="rgba(63,214,245,.28)"/><stop offset="1" stop-color="rgba(11,42,79,.6)"/></linearGradient></defs>
     <path d="M30 70a26 26 0 0 1 26-26h120l36 40h232a26 26 0 0 1 26 26v234a26 26 0 0 1-26 26H56a26 26 0 0 1-26-26z" fill="url(#fg)" stroke="#00CCF2" stroke-width="3"/>
     <path d="M30 120h440" stroke="rgba(63,214,245,.45)" stroke-width="2"/>
     <text x="250" y="262" text-anchor="middle" font-family="Sora" font-weight="700" font-size="104" fill="#3FD6F5">&lt;/&gt;</text>
   </svg>`);
   put(`<div class="abs" style="left:250px;top:470px;width:150px;height:150px;color:var(--orange);transform:rotate(-12deg);filter:drop-shadow(0 0 16px rgba(245,106,57,.55))">${svg(I.key,1.8)}</div>`);
   put(`<div class="pill" style="left:162px;top:690px;border:2px solid rgba(191,208,230,.25);color:rgba(191,208,230,.45);text-decoration:line-through">المبرمج</div>`);
   put(`<div class="pill" style="left:400px;top:690px;border:2px solid rgba(191,208,230,.25);color:rgba(191,208,230,.45);text-decoration:line-through">الشركة</div>`);
   put(`<div class="pill" style="left:620px;top:680px;height:88px;padding:0 30px;font-size:34px;font-weight:700;background:rgba(0,204,242,.14);border:2.5px solid var(--cyan);color:#fff;box-shadow:0 0 30px rgba(0,204,242,.35)">${chk()}انت</div>`);
  }},
 { // 2 weekly demo
  kick:'سؤال ٢ من ٥',
  head:'هشوف الشغل إمتى<span class="o">؟</span>',
  sub:'لو أول مرة هتشوف التطبيق يوم التسليم، يبقى بتراهن.<br>لازم تشوف نسخة تجريبية كل أسبوع.',dy:105,
  draw(){
   const W=['أسبوع ١','أسبوع ٢','أسبوع ٣','أسبوع ٤'];
   put(`<div class="abs" style="left:150px;right:150px;top:575px;height:3px;background:linear-gradient(90deg,rgba(0,204,242,.15),#00CCF2,rgba(0,204,242,.15))"></div>`);
   W.forEach((w,i)=>{const x=760-i*205, n=i+1, on=i===3;
     put(`<div class="glass" style="left:${x}px;top:${on?300:330}px;width:170px;height:${on?330:300}px;border-radius:30px;padding:30px 20px;${on?'border-color:#3FD6F5;box-shadow:0 0 60px rgba(0,204,242,.45),0 30px 60px rgba(0,0,0,.35)':''}">
       <div style="width:44px;height:6px;border-radius:3px;background:rgba(191,208,230,.35);margin:0 auto 22px"></div>
       ${Array.from({length:4},(_,k)=>k<n?`<div class="bar" style="height:${k===0?54:16}px;margin-bottom:14px;background:${k===0?'rgba(0,204,242,.28)':'rgba(191,208,230,.3)'};width:${[100,80,90,66][k]}%"></div>`:`<div style="height:${k===0?54:16}px;margin-bottom:14px;border-radius:8px;border:2px dashed rgba(191,208,230,.18)"></div>`).join('')}
     </div>`);
     put(`<div class="abs" style="left:${x+63}px;top:${on?650:650}px;width:44px">${chk()}</div>`);
     put(`<div class="abs" style="left:${x}px;width:170px;top:712px;text-align:center;font:600 28px Plex;color:${on?'#fff':'var(--muted)'}">${w}</div>`);
   });
   put(`<div class="abs" style="left:490px;top:200px;width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(245,106,57,.14);border:2.5px solid var(--orange);color:var(--orange);box-shadow:0 0 30px rgba(245,106,57,.4)"><span style="width:54px;height:54px">${svg(I.eye,2)}</span></div>`);
  }},
 { // 3 price
  kick:'سؤال ٣ من ٥',
  head:'السعر ده شامل إيه<span class="o">؟</span>',
  sub:'اطلب سعر كل ميزة لوحدها، واسأل عن السيرفر والمتجر.<br>عشان متتفاجئش بفاتورة بعد التسليم.',dy:45,
  draw(){
   const R=['تسجيل الدخول','لوحة التحكم','الدفع أونلاين','السيرفر','الرفع على المتجر'];
   put(`<div class="abs" style="left:310px;top:170px;width:460px;height:660px;filter:drop-shadow(0 0 40px rgba(0,204,242,.25)) drop-shadow(0 30px 50px rgba(0,0,0,.4))">
     <svg class="abs" width="460" height="660" viewBox="0 0 460 660" style="left:0;top:0">
       <defs><linearGradient id="rg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="rgba(63,214,245,.2)"/><stop offset="1" stop-color="rgba(11,42,79,.7)"/></linearGradient></defs>
       <path d="${(()=>{let d='M30 2h400a26 26 0 0 1 26 26v624';for(let k=0;k<20;k++)d+=`l-22.6 ${k%2?16:-16}`;return d+'V28A26 26 0 0 1 30 2z'})()}" fill="url(#rg)" stroke="#00CCF2" stroke-width="2.5"/>
     </svg>
     <div class="abs" style="left:44px;right:44px;top:44px;direction:rtl">
       <div style="font:700 32px Plex;text-align:center;margin-bottom:8px">عرض سعر</div>
       <div style="border-top:2.5px dashed rgba(191,208,230,.35);margin:18px 0 22px"></div>
       ${R.map(r=>`<div class="row" style="justify-content:space-between;margin-bottom:24px;font:600 27px Plex"><span>${r}</span><span style="font:700 22px Sora;color:var(--cyan2);letter-spacing:4px;direction:ltr">•••• EGP</span></div>`).join('')}
       <div style="border-top:2.5px dashed rgba(191,208,230,.35);margin:6px 0 22px"></div>
       <div class="row" style="justify-content:space-between;font:700 30px Plex"><span>الإجمالي</span><span class="row" style="gap:12px;color:var(--cyan2)">واضح ${chk()}</span></div>
     </div>
   </div>`);
   put(`<div class="pill" style="left:70px;top:760px;transform:rotate(-8deg);border:2.5px dashed var(--orange);color:var(--orange);background:rgba(245,106,57,.08);font-weight:700">مصاريف مخفية؟<span style="position:absolute;left:14px;right:14px;top:50%;height:3px;background:var(--orange);transform:rotate(-7deg);box-shadow:0 0 8px rgba(245,106,57,.7)"></span></div>`);
  }},
 { // 4 security
  kick:'سؤال ٤ من ٥',
  head:'هتختبروا الأمان إزاي<span class="o">؟</span>',
  sub:'«متقلقش» مش إجابة. اسأل: هتجربوه ضد هجوم حقيقي<br>قبل ما يوصل لعملائي؟ وهتدوني تقرير؟',dy:70,
  draw(){
   put(`<div class="glass" style="left:330px;top:300px;width:600px;height:400px;padding:50px 56px 0 130px">
     <div style="font:700 32px Plex;margin-bottom:34px">تقرير اختبار الأمان</div>
     ${['هجوم حقيقي قبل التسليم','تقرير بكل ثغرة لقيناها','اتصلحت قبل ما تنزل'].map(t=>`<div class="row" style="margin-bottom:28px;font:600 27px Plex">${chk()}<span>${t}</span></div>`).join('')}
   </div>`);
   put(`<svg class="abs" style="left:150px;top:250px" width="290" height="330" viewBox="0 0 290 330" filter="url(#glow)">
     <defs><linearGradient id="sg" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="rgba(63,214,245,.42)"/><stop offset="1" stop-color="rgba(11,42,79,.9)"/></linearGradient></defs>
     <path d="M145 12 268 56v94c0 82-52 140-123 166C74 290 22 232 22 150V56z" fill="url(#sg)" stroke="#3FD6F5" stroke-width="4" stroke-linejoin="round"/>
     <path d="M92 166l38 38 72-78" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
   </svg>`);
   put(`<div class="abs" style="left:862px;top:640px;width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0B2A4F;border:2.5px solid var(--orange);color:var(--orange);box-shadow:0 0 26px rgba(245,106,57,.4)">
     <span style="position:relative;width:58px;height:58px">${svg(I.bug,1.8)}<span style="position:absolute;left:-8px;right:-8px;top:50%;height:4px;margin-top:-2px;background:var(--orange);border-radius:2px;transform:rotate(-45deg)"></span></span></div>`);
  }},
 { // 5 after delivery
  kick:'سؤال ٥ من ٥',
  head:'بعد التسليم… مين معايا<span class="o">؟</span>',
  sub:'التطبيق هيحتاج تحديثات وتصليحات.<br>اعرف من دلوقتي مين هيرد عليك، ولحد إمتى.',dy:22,
  draw(){
   put(`<div class="abs" style="left:350px;top:160px;width:380px;height:720px;border-radius:60px;background:linear-gradient(145deg,#2B3A55,#0E1726 55%,#1C2A42);padding:14px;box-shadow:0 0 60px rgba(0,204,242,.25),0 40px 80px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.12)">
     <div style="position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:linear-gradient(180deg,#0C2C52,#0A2444);direction:rtl;padding:80px 24px 0">
       <div style="position:absolute;left:50%;top:14px;width:110px;height:32px;margin-left:-55px;border-radius:18px;background:#05070C"></div>
       <div style="text-align:center;font:600 22px Plex;color:var(--muted);margin-bottom:26px">الدعم الفني · بعد ٣ شهور</div>
       <div style="margin-left:60px;padding:18px 22px;border-radius:24px 24px 24px 8px;background:rgba(255,255,255,.1);font:400 25px Plex;line-height:1.45">زرار الدفع مش شغال عند عميل 😕<div style="font:400 17px Sora;color:var(--muted);direction:ltr;text-align:left;margin-top:6px">10:02</div></div>
       <div style="margin-right:60px;margin-top:22px;padding:18px 22px;border-radius:24px 24px 8px 24px;background:rgba(0,204,242,.22);border:1.5px solid rgba(0,204,242,.6);font:400 25px Plex;line-height:1.45">شفناها، وبنصلّحها دلوقتي.<div style="font:400 17px Sora;color:var(--cyan2);direction:ltr;text-align:left;margin-top:6px">10:09 ✓✓</div></div>
       <div style="margin-right:60px;margin-top:16px;padding:18px 22px;border-radius:24px 24px 8px 24px;background:rgba(0,204,242,.22);border:1.5px solid rgba(0,204,242,.6);font:400 25px Plex;line-height:1.45">اتصلحت. جرّب تاني ✓<div style="font:400 17px Sora;color:var(--cyan2);direction:ltr;text-align:left;margin-top:6px">10:31 ✓✓</div></div>
     </div></div>`);
  }},
 { // CTA
  kick:'وإحنا؟',
  head:'بنجاوب على الخمسة… قبل ما تسأل<span class="o">.</span>',
  sub:'',cta:true,dy:45,
  draw(){
   const A=['الكود والحسابات باسمك','نسخة تجريبية كل أسبوع','سعر واضح لكل ميزة','اختبار اختراق قبل التسليم','معاك بعد التسليم'];
   put(`<div class="glass" style="left:200px;top:200px;width:680px;height:640px;padding:48px 60px 0">
     <div class="row" style="justify-content:space-between;margin-bottom:30px"><span style="font:700 34px Plex">إجابات لوجيكا</span><span style="font:700 30px Sora;color:var(--cyan2);direction:ltr">5/5</span></div>
     ${A.map(a=>`<div class="row" style="margin-bottom:24px;padding-bottom:24px;border-bottom:1.5px solid rgba(191,208,230,.12);font:600 31px Plex">${chk()}<span>${a}</span></div>`).join('')}
   </div>`);
  }},
];

const n=Math.max(1,Math.min(SLIDES.length,parseInt(location.hash.slice(1))||1)), S=SLIDES[n-1];
document.getElementById('kick').textContent=S.kick;
const head=document.getElementById('head');
head.innerHTML=S.head2?`<div style="font-size:56px;color:#D6E2F0">${S.head}</div><div style="font-size:96px">${S.head2}</div>`:S.head;
const sub=document.getElementById('sub');if(S.sub)sub.innerHTML=S.sub;else sub.remove();
if(S.cta)document.getElementById('copy').insertAdjacentHTML('beforeend',`<div id="cta">${ic('wa',38,'#fff',2)}كلّمنا على واتساب</div>`);
const cnt=document.getElementById('count');
if(n>1&&n<SLIDES.length)for(let i=1;i<=5;i++)cnt.insertAdjacentHTML('beforeend',`<i class="${i<=n-1?'on':''}"></i>`);
S.draw();art.style.transform=`translateY(${S.dy||60}px) scale(1.06)`;art.style.transformOrigin='540px 480px';
document.fonts.ready.then(()=>{
  // shrink the headline until it fits on one line
  [...(S.head2?head.children:[head])].forEach(h=>{let s=parseFloat(getComputedStyle(h).fontSize);while(h.scrollWidth>952&&s>40){s-=2;h.style.fontSize=s+'px';}});
  window.__ready=true;});
</script>
</body>
</html>
